[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-service"
version = "0.1.0"
description = "Vendor-neutral enterprise RAG service skeleton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["datasets>=4,<5", "fastapi>=0.115,<1", "huggingface-hub>=1.4,<2", "pydantic-settings>=2.6,<3", "uvicorn[standard]>=0.32,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8", "pytest-cov>=5"]
ai = ["accelerate>=1,<2", "safetensors>=0.6,<1", "sentence-transformers>=5.7,<6", "transformers>=5.16,<6"]
optimization = ["onnxruntime>=1.29,<2"]
training = ["evaluate>=0.4,<1", "peft>=0.17,<1", "trl>=0.20,<1"]
media = ["diffusers>=0.35,<1", "soundfile>=0.13,<1"]

[project.scripts]
rag-service = "rag_service.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.setuptools.packages.find]
where = ["src"]
