[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-service"
version = "0.1.0"
description = "Vendor-neutral enterprise RAG service skeleton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "pydantic-settings>=2.6,<3", "uvicorn[standard]>=0.32,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
rag-service = "rag_service.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.setuptools.packages.find]
where = ["src"]
